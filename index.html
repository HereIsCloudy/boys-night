<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vraj Quest: Online Multiplayer</title>
    <!-- Include free P2P networking library -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #game-container {
            width: 550px;
            background-color: #111;
            border: 4px solid #fff;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .lobby-screen {
            text-align: center;
            padding: 20px;
        }
        .lobby-input {
            background: #333;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px;
            font-family: inherit;
            font-size: 16px;
            margin: 10px 0;
            width: 80%;
            text-align: center;
        }
        .battle-arena {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 2px dashed #444;
            padding-bottom: 20px;
        }
        .fighter-row {
            display: flex;
            align-items: center;
            width: 100%;
        }
        .opponent-row { justify-content: flex-end; }
        .your-row { justify-content: flex-start; flex-direction: row-reverse; }
        .fighter-box { width: 40%; text-align: center; }
        .status-box { width: 55%; background: #222; border: 2px solid #555; padding: 8px; border-radius: 5px; }
        .fighter-img { width: 130px; height: 130px; object-fit: cover; border: 3px solid #fff; border-radius: 12px; background-color: #333; }
        .your-img { border-color: #4caf50; }
        .opponent-img { border-color: #f44336; }
        .hp-bar-container { width: 100%; background-color: #444; height: 12px; margin-top: 5px; border: 1px solid #fff; }
        .hp-bar { height: 100%; background-color: #4caf50; width: 100%; transition: width 0.3s ease; }
        #log-box { height: 110px; background-color: #000; border: 2px solid #444; padding: 10px; overflow-y: auto; font-size: 14px; margin-bottom: 20px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button.game-btn { background-color: #333; color: #fff; border: 2px solid #fff; padding: 10px; cursor: pointer; font-family: inherit; font-weight: bold; text-align: left; display: flex; flex-direction: column; justify-content: center; }
        button.game-btn span.btn-title { font-size: 14px; color: #fff; }
        button.game-btn span.btn-desc { font-size: 11px; color: #aaa; font-weight: normal; margin-top: 2px; }
        button:hover:not(:disabled) { background-color: #fff; color: #000; }
        button:hover:not(:disabled) span.btn-desc { color: #555; }
        button:disabled { background-color: #222; color: #555; border-color: #555; cursor: not-allowed; }
        button:disabled span.btn-desc { color: #444; }
        .status-banner { text-align: center; font-size: 18px; margin-bottom: 15px; color: #ffeb3b; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- LOBBY SCREEN -->
    <div id="lobby" class="lobby-screen">
        <h2>VRAJ MULTIPLAYER LOBBY</h2>
        
        <!-- HOST SECTION -->
        <p style="margin-bottom: 5px; font-weight: bold; color: #4caf50;">HOST A GAME</p>
        <p style="font-size: 12px; margin: 0 0 10px 0; color: #aaa;">Type any characters to make your room code:</p>
        <input type="text" id="custom-id-input" class="lobby-input" placeholder="e.g. Vraj123!"><br>
        <button onclick="createCustomRoom()" style="text-align: center; width: 85%; margin-bottom: 15px; display: block; margin: 0 auto 15px auto;">Create Custom Room</button>
        
        <div id="host-status" style="font-size: 13px; color: #ffeb3b; min-height: 20px; margin-bottom: 10px;"></div>

        <hr style="border:1px dashed #444; margin:15px 0;">
        
        <!-- JOIN SECTION -->
        <p style="margin-bottom: 5px; font-weight: bold; color: #2196f3;">JOIN A GAME</p>
        <p style="font-size: 12px; margin: 0 0 10px 0; color: #aaa;">Type your friend's exact room code to join them:</p>
        <input type="text" id="peer-id-input" class="lobby-input" placeholder="Enter Friend's Code Here"><br>
        <button id="join-btn" onclick="connectToFriend()" style="text-align: center; width: 85%; display: block; margin: 0 auto;">Search & Connect</button>
    </div>

    <!-- BATTLE SCREEN -->
    <div id="battleground" style="display: none;">
        <div class="status-banner" id="turn-display">WAITING FOR NETWORK...</div>
        
        <div class="battle-arena">
            <!-- OPPONENT VRAJ -->
            <div class="fighter-row opponent-row">
                <div class="status-box">
                    <h3 id="opponent-name-label" style="margin: 0; font-size: 16px;">Enemy Vraj</h3>
                    <div class="hp-bar-container"><div id="opponent-hp-bar" class="hp-bar"></div></div>
                    <div id="opponent-hp-text" style="font-size: 11px; text-align: right; margin-top: 2px;">100/100 HP</div>
                </div>
                <div class="fighter-box"><img src="vraj.png" alt="Enemy Vraj" class="fighter-img opponent-img"></div>
            </div>

            <!-- YOUR VRAJ -->
            <div class="fighter-row your-row">
                <div class="status-box">
                    <h3 style="margin: 0; font-size: 16px;">Your Vraj</h3>
                    <div class="hp-bar-container"><div id="your-hp-bar" class="hp-bar"></div></div>
                    <div id="your-hp-text" style="font-size: 11px; text-align: right; margin-top: 2px;">100/100 HP</div>
                </div>
                <div class="fighter-box"><img src="vraj.png" alt="Your Vraj" class="fighter-img your-img"></div>
            </div>
        </div>

        <div id="log-box">Connected! Ready for the showdown...</div>

        <!-- CONTROLS WITH RE-DESIGNED 2-COLUMN BUTTON LAYOUT -->
        <div class="controls">
            <button class="game-btn" onclick="sendMove('scream')">
                <span class="btn-title">🎶 dinga dinga dinga ding</span>
                <span class="btn-desc">Steady damage (15-25 dmg)</span>
            </button>
            <button class="game-btn" onclick="sendMove('sprint')">
                <span class="btn-title">🚿 Shower Hose</span>
                <span class="btn-desc">Risky heavy attack (8-28 dmg)</span>
            </button>
            <button class="game-btn" onclick="sendMove('heal')">
                <span class="btn-title">🍛 Munch Curry</span>
                <span class="btn-desc">Heal yourself (12-24 HP)</span>
            </button>
            <button class="game-btn" onclick="sendMove('dice')" style="border-color: #ff9800;">
                <span class="btn-title" style="color: #ff9800;">🎲 Roulette Dice Roll</span>
                <span class="btn-desc">10=1Tap | 5+=15dmg | 1=Self Death</span>
            </button>
        </div>
    </div>
</div>

<script>
    let peer = null; 
    let conn = null;
    let myRole = ""; 
    let logicIsMyTurn = false;

    let myHp = 100, maxHp = 100;
    let oppHp = 100;

    function createCustomRoom() {
        const customId = document.getElementById('custom-id-input').value.trim();
        if(!customId) return alert("Type a room code first!");

        document.getElementById('host-status').innerText = "Registering room code...";
        if (peer) { peer.destroy(); }
        peer = new Peer(customId);

        peer.on('open', (id) => {
            document.getElementById('host-status').innerHTML = `Room active! Tell your friend your code: <br><strong style="font-size:18px; color:#fff;">${id}</strong><br>Waiting for them to connect...`;
        });

        peer.on('error', (err) => {
            if(err.type === 'unavailable-id') {
                document.getElementById('host-status').innerText = "";
                alert("That room code is already taken! Try a different one.");
            } else {
                alert("Network error: " + err.type);
            }
        });

        peer.on('connection', (connection) => {
            conn = connection;
            myRole = "host";
            logicIsMyTurn = true; 
            setupNetworkHandlers();
            startBattleDisplay();
        });
    }

    function connectToFriend() {
        const targetId = document.getElementById('peer-id-input').value.trim();
        if(!targetId) return alert("Type a room ID first!");
        
        document.getElementById('join-btn').innerText = "Connecting...";
        document.getElementById('join-btn').disabled = true;
        if (peer) { peer.destroy(); }
        peer = new Peer();

        peer.on('open', () => {
            conn = peer.connect(targetId);
            myRole = "guest";
            logicIsMyTurn = false; 
            setupNetworkHandlers();
            startBattleDisplay();
        });

        peer.on('error', (err) => {
            document.getElementById('join-btn').innerText = "Search & Connect";
            document.getElementById('join-btn').disabled = false;
            alert("Could not find that room. Make sure your friend has already created it!");
        });
    }

    function startBattleDisplay() {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('battleground').style.display = 'block';
        document.getElementById('opponent-name-label').innerText = myRole === "host" ? "Guest Vraj" : "Host Vraj";
        updateUI();
    }

    function setupNetworkHandlers() {
        conn.on('data', (data) => {
            if (data.type === 'move') {
                processOpponentMove(data.moveType, data.value, data.diceRoll);
            }
        });
        conn.on('close', () => {
            alert("Opponent disconnected!");
            location.reload();
        });
    }

    function updateUI() {
        document.getElementById('your-hp-bar').style.width = Math.max(0, myHp) + '%';
        document.getElementById('opponent-hp-bar').style.width = Math.max(0, oppHp) + '%';
        document.getElementById('your-hp-text').innerText = `${myHp}/${maxHp} HP`;
        document.getElementById('opponent-hp-text').innerText = `${oppHp}/${maxHp} HP`;

        const btns = document.querySelectorAll('.game-btn');
        if (logicIsMyTurn) {
            document.getElementById('turn-display').innerText = "YOUR TURN TO STRIKE!";
            document.getElementById('turn-display').style.color = "#4caf50";
            btns.forEach(b => b.disabled = false);
        } else {
            document.getElementById('turn-display').innerText = "WAITING FOR OPPONENT...";
            document.getElementById('turn-display').style.color = "#f44336";
            btns.forEach(b => b.disabled = true);
        }
    }

    function logMessage(text) {
        const logBox = document.getElementById('log-box');
        logBox.innerHTML += `<br>${text}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function sendMove(moveType) {
        if (!logicIsMyTurn) return;

        let value = 0;
        let diceRoll = 0;
        let msg = "";

        if (moveType === 'scream') {
            value = Math.floor(Math.random() * 10) + 15;
            oppHp = Math.max(0, oppHp - value);
            msg = `Your Vraj breaks out into <strong>🎶 dinga dinga dinga ding</strong>! It deals ${value} damage!`;
        } else if (moveType === 'sprint') {
            value = Math.floor(Math.random() * 20) + 8;
            oppHp = Math.max(0, oppHp - value);
            msg = `Your Vraj uncoils the <strong>🚿 Shower Hose</strong> and blasts them for ${value} damage!`;
        } else if (moveType === 'heal') {
            value = Math.floor(Math.random() * 12) + 12;
            myHp = Math.min(maxHp, myHp + value);
            msg = `Your Vraj grabs a plate to <strong>🍛 Munch Curry</strong>! Recovers ${value} HP.`;
        } else if (moveType === 'dice') {
            diceRoll = Math.floor(Math.random() * 10) + 1; // 1 to 10
            if (diceRoll === 10) {
                value = oppHp; // All remaining HP
                oppHp = 0;
                msg = `🎲 Your Vraj rolled a <strong>10</strong>! 💥 <strong>ULTIMATE 1-TAP!</strong> Dropped the enemy instantly!`;
            } else if (diceRoll >= 5) {
                value = 15;
                oppHp = Math.max(0, oppHp - 15);
                msg = `🎲 Your Vraj rolled a <strong>${diceRoll}</strong>! Hit for a solid 15 damage.`;
            } else if (diceRoll === 1) {
                value = -1; // Flag for special self-destruction execution
                myHp = 0;
                msg = `🎲 Your Vraj rolled a <strong>1</strong>! 💀 <strong>BACKFIRE CRITICAL ERROR!</strong> Your Vraj instantly fainted!`;
            } else {
                value = 0;
                msg = `🎲 Your Vraj rolled a <strong>${diceRoll}</strong>! The attack missed completely!`;
            }
        }

        logMessage(msg);
        conn.send({ type: 'move', moveType: moveType, value: value, diceRoll: diceRoll });
        
        checkWinCondition();
        if(myHp > 0 && oppHp > 0) {
            logicIsMyTurn = false;
            updateUI();
        }
    }

    function processOpponentMove(moveType, value, diceRoll) {
        let msg = "";
        if (moveType === 'scream') {
            myHp = Math.max(0, myHp - value);
            msg = `Opponent's Vraj sings <strong>🎶 dinga dinga dinga ding</strong>! You took ${value} damage.`;
        } else if (moveType === 'sprint') {
            myHp = Math.max(0, myHp - value);
            msg = `Opponent fires up the <strong>🚿 Shower Hose</strong>! You get blasted for ${value} damage.`;
        } else if (moveType === 'heal') {
            oppHp = Math.min(maxHp, oppHp + value);
            msg = `Opponent takes a break to <strong>🍛 Munch Curry</strong> and recovers ${value} HP.`;
        } else if (moveType === 'dice') {
            if (diceRoll === 10) {
                myHp = 0;
                msg = `🎲 Opponent rolled a <strong>10</strong>! 💥 You just got <strong>1-TAPPED</strong>!`;
            } else if (diceRoll >= 5) {
                myHp = Math.max(0, myHp - 15);
                msg = `🎲 Opponent rolled a <strong>${diceRoll}</strong> and dealt 15 damage to you.`;
            } else if (diceRoll === 1) {
                oppHp = 0;
                msg = `🎲 Opponent rolled a <strong>1</strong>! 💀 Their engine exploded and their Vraj instantly fainted!`;
            } else {
                msg = `🎲 Opponent rolled a <strong>${diceRoll}</strong>. Luckily, it missed you!`;
            }
        }

        logMessage(msg);
        checkWinCondition();
        if(myHp > 0 && oppHp > 0) {
            logicIsMyTurn = true;
            updateUI();
        }
    }

    function checkWinCondition() {
        if (myHp <= 0 || oppHp <= 0) {
            updateUI();
            const btns = document.querySelectorAll('.game-btn');
            btns.forEach(b => b.disabled = true);
            
            if (myHp <= 0) {
                document.getElementById('turn-display').innerText = "DEFEAT!";
                logMessage("❌ Your Vraj passed out. Better luck next time!");
            } else {
                document.getElementById('turn-display').innerText = "VICTORY!";
                logMessage("🏆 Enemy fainted! Your Vraj rules the field.");
            }
        }
    }
</script>

</body>
</html>
