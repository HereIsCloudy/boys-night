<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riley World</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">

    <header class="header">
      <h1 class="logo">🌸 Riley World</h1>
      <div class="header-stats">
        <span id="cookies-per-sec" class="cps">0 coins/sec</span>
      </div>
    </header>

    <main class="game-layout">

      <!-- Left: upgrades -->
      <aside class="panel upgrades-panel">
        <h2>Upgrades</h2>
        <div id="upgrades-list" class="upgrades-list"></div>
      </aside>

      <!-- Center: clicker -->
      <section class="clicker-area">
        <p class="score-label">Riley Coins</p>
        <h2 id="score" class="score">0</h2>
        <p id="total-label" class="total-label">Total earned: 0</p>
        <button id="riley-btn" class="riley-btn" aria-label="Click Riley">
          <span class="riley-face">🌸</span>
          <span class="riley-name">Riley</span>
        </button>
        <p class="click-hint">Click Riley to earn coins!</p>
        <div id="float-container" class="float-container" aria-hidden="true"></div>
      </section>

      <!-- Right: buildings -->
      <aside class="panel buildings-panel">
        <h2>Buildings</h2>
        <div id="buildings-list" class="buildings-list"></div>
      </aside>

    </main>

    <!-- Milestone toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

  </div>
  <script src="app.js"></script>
</body>
</html>
